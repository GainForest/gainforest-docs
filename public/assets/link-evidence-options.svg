  <text x="190" y="405" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#243b2d">Attach optional evidence</text>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="190" y="440" width="185" height="72" rx="18" fill="#eef7f0" stroke="#3e7053" stroke-width="3"/>
